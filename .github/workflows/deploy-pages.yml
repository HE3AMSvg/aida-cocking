name: Validate and deploy Aida Cockings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check config.js
      - name: Verify required site files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s admin.html
          test -s admin.css
          test -s admin.js
          test -s supabase.sql
          test -s config.js
      - name: Verify critical order flow markers
        run: |
          grep -q "aida_submit_order" app.js
          grep -q "aida_is_admin" admin.js
          grep -q "enable row level security" supabase.sql

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
